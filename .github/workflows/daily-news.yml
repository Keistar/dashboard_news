name: Daily News (RSS)

on:
  # 定期実行はローカルPCで行う（scripts/run_local.sh）。自動化したい場合はここに schedule を追加する。
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Generate all genres from RSS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_NEWS_US }}
        run: |
          for g in ai gadget kosodate beauty food health pet outdoor bousai; do
            python scripts/rss_news.py --genre "$g" || echo "::warning::$g failed"
          done

      - name: Commit and push
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update news $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
